<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Özkan & Nuray - Düğün Davetiyesi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Scroll Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            font-family: 'Montserrat', sans-serif;
            color: #d4af37;
            overflow-x: hidden;
        }

        /* --- ZARF EKRANI (TAM EKRAN MOBİL UYUMLU) --- */
        #envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            cursor: pointer;
        }

        .envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: url('zarf.png') center center / cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* Zarfa Dokun İpucu Mührü */
        .seal-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(13, 13, 13, 0.45);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(212, 175, 55, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            animation: pulse 2s infinite;
            pointer-events: none; /* Dokunmayı engellemesin, tüm ekrana basılabilsin */
        }

        .seal-hint i {
            font-size: 20px;
            color: #f3e5ab;
            margin-bottom: 4px;
        }

        .seal-hint span {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: #f3e5ab;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6); }
            70% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 0 18px rgba(212, 175, 55, 0); }
            100% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .envelope-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- ANA PREMİUM KART İÇERİĞİ --- */
        .main-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: url('kart.png') top center / cover no-repeat fixed;
            position: relative;
            padding: 70px 25px 90px 25px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            text-align: center;
            display: none;
        }

        .main-container.visible {
            display: block;
        }

        .sub-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 5px;
            color: #f3e5ab;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: #fcf6ba;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
            margin: 10px 0;
            line-height: 1.1;
        }

        .ampersand {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #d4af37;
            display: block;
            margin: 4px 0;
        }

        .quote {
            font-size: 13.5px;
            font-style: italic;
            color: #e6e6e6;
            line-height: 1.7;
            margin: 25px 0;
            padding: 0 10px;
            font-weight: 300;
        }

        .divider {
            height: 1px;
            width: 65%;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 30px auto;
        }

        .date-box {
            margin: 20px 0;
        }

        .date-box .date {
            font-family: 'Cinzel', serif;
            font-size: 21px;
            letter-spacing: 3px;
            color: #fcf6ba;
            font-weight: 600;
        }

        .date-box .time {
            font-size: 13px;
            letter-spacing: 2px;
            color: #d4af37;
            margin-top: 6px;
        }

        /* Geri Sayım */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }

        .count-item {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.45);
            padding: 10px 8px;
            border-radius: 8px;
            min-width: 62px;
            backdrop-filter: blur(5px);
        }

        .count-item span {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: bold;
            color: #fcf6ba;
        }

        .count-item label {
            font-size: 8.5px;
            letter-spacing: 1px;
            color: #aaa;
            text-transform: uppercase;
        }

        .venue-title {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            color: #fcf6ba;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .venue-address {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .btn-map {
            display: inline-block;
            padding: 12px 32px;
            border: 1px solid #d4af37;
            border-radius: 25px;
            color: #fcf6ba;
            text-decoration: none;
            font-size: 11.5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .btn-map:hover, .btn-map:active {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        /* Müzik Butonu */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 12px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <!-- Ses Dosyası -->
    <audio id="bg-music" src="muzik.mp3" loop></audio>

    <!-- Müzik Kontrol Butonu -->
    <div class="music-control" id="music-btn" onclick="toggleMusic(event)">
        <i class="fa-solid fa-music"></i>
    </div>

    <!-- ZARF AÇILIŞ EKRANI (AÇILMAK İÇİN HERYERE TIKLANABİLİR) -->
    <div id="envelope-screen" onclick="openEnvelope()">
        <div class="envelope-wrapper">
            <div class="seal-hint">
                <i class="fa-solid fa-envelope-open-text"></i>
                <span>DOKUNUN</span>
            </div>
        </div>
    </div>

    <!-- ANA DAVETİYE KARTI -->
    <div class="main-container" id="main-card">

        <div data-aos="fade-down" data-aos-duration="1200">
            <div class="sub-title">EVLENİYORUZ</div>
            <div class="names">
                Özkan <span class="ampersand">&</span> Nuray
            </div>
        </div>

        <div class="divider" data-aos="zoom-in" data-aos-duration="1000"></div>

        <p class="quote" data-aos="fade-up" data-aos-duration="1200">
            "Hayatımızın en özel gününde, mutluluğumuza tanıklık etmenizden ve bu güzel günü bizimle paylaşmanızdan onur duyarız."
        </p>

        <div class="divider" data-aos="zoom-in" data-aos-duration="1000"></div>

        <!-- TARİH VE SAAT (GERÇEK DÜĞÜN TARİHİN) -->
        <div class="date-box" data-aos="fade-up" data-aos-duration="1200">
            <div class="date">07 TEMMUZ 2027</div>
            <div class="time">ÇARŞAMBA | SAAT: 19:00</div>
        </div>

        <!-- GERİ SAYIM -->
        <div class="countdown" data-aos="flip-up" data-aos-duration="1200">
            <div class="count-item">
                <span id="days">00</span>
                <label>Gün</label>
            </div>
            <div class="count-item">
                <span id="hours">00</span>
                <label>Saat</label>
            </div>
            <div class="count-item">
                <span id="minutes">00</span>
                <label>Dakika</label>
            </div>
            <div class="count-item">
                <span id="seconds">00</span>
                <label>Saniye</label>
            </div>
        </div>

        <div class="divider" data-aos="zoom-in" data-aos-duration="1000"></div>

        <!-- MEKAN VE ADRES (SİNCAN / ANKARA) -->
        <div data-aos="fade-up" data-aos-duration="1200">
            <div class="venue-title">Boran Park Düğün Salonu</div>
            <p class="venue-address">
                Sincan / Ankara
            </p>
            <a href="https://maps.google.com/?q=Boran+Park+Düğün+Salonu+Sincan+Ankara" target="_blank" class="btn-map">
                <i class="fa-solid fa-location-dot"></i> Haritada Yol Tarifi Al
            </a>
        </div>

    </div>

    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const music = document.getElementById('bg-music');
        let isPlaying = false;

        function openEnvelope() {
            const env = document.getElementById('envelope-screen');
            const mainCard = document.getElementById('main-card');

            // Zarfı kapat
            env.classList.add('hidden');
            
            // Kartı görünür yap
            mainCard.classList.add('visible');

            // AOS Animasyonlarını başlat
            AOS.init({
                once: true,
                duration: 1000
            });
            AOS.refresh();

            // Müzik çal
            music.play().then(() => {
                isPlaying = true;
            }).catch(err => {
                console.log("Müzik otomatik başlatılamadı:", err);
            });
        }

        function toggleMusic(e) {
            e.stopPropagation(); // Zarfa tıklama tetiklenmesin
            const btnIcon = document.querySelector('#music-btn i');
            if (isPlaying) {
                music.pause();
                btnIcon.className = 'fa-solid fa-volume-xmark';
            } else {
                music.play();
                btnIcon.className = 'fa-solid fa-music';
            }
            isPlaying = !isPlaying;
        }

        // GERİ SAYIM (07 Temmuz 2027)
        const weddingDate = new Date("July 7, 2027 19:00:00").getTime();

        setInterval(function() {
            const now = new Date().getTime();
            const diff = weddingDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }, 1000);
    </script>
</body>
</html>
