<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elif & Ali — Düğün Davetiyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Tangerine:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EE;
    --ivory-deep:#F1E5CF;
    --gold:#B8933D;
    --gold-light:#E7CD8E;
    --wine:#6E1F2B;
    --ink:#2B231C;
    --ink-soft:#5C4F41;
    --blush:#E9CFC6;
    --max-w:640px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1,h2{font-family:'Cormorant Garamond', serif; font-weight:500; margin:0;}

  a{color:inherit;}

  button{
    font-family:inherit;
    cursor:pointer;
    background:none;
    border:none;
  }
  button:focus-visible,
  input:focus-visible{
    outline:2px solid var(--wine);
    outline-offset:3px;
  }

  /* ---------- INTRO ---------- */
  #intro{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#1a1410;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #intro.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #introVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.55;
  }
